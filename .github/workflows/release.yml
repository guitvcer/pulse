name: Release

# Pushing a tag like v1.0.0 builds a universal Pulse.app and publishes a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
      - run: make check
      - run: make package
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/Pulse.zip build/Pulse.zip.sha256 --repo "${{ github.repository }}" --generate-notes
